name: ElevenLabs plan check (read-only)

# فحص للقراءة فقط قبل النشر: لا يستهلك رصيدًا ولا يغيّر الحساب أو الموقع.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python .github/tools/check_credits.py
